spring.application.name=baozi-store
server.port=8080

# Mostra a mensagem de erro (ex.: "Cliente não encontrado") no corpo da resposta
server.error.include-message=always

# ===== Banco H2 (em memória) - configuração padrão =====
spring.datasource.url=jdbc:h2:mem:baozidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Para usar MySQL, comente o bloco H2 acima e descomente abaixo =====
# spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=SUA_SENHA
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
